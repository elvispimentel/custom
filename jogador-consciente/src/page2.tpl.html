<style>
:root{
  --ground:#E7EAEF; --surface:#F6F8FB; --surface-2:#EDF0F5;
  --ink:#131722; --ink-soft:#39414F; --muted:#5A6478; --rule:#C6CDD9; --rule-soft:#D8DEE7;
  --brass:#9C7016; --teal:#1B6C7E; --rust:#9B4630;
  --shadow:0 1px 2px rgba(19,23,34,.06),0 10px 28px -14px rgba(19,23,34,.2);
  --serif:'Fraunces',Georgia,serif; --sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0E15; --surface:#121926; --surface-2:#0F1520;
  --ink:#DCE3EE; --ink-soft:#B4C0D2; --muted:#8391A6; --rule:#212B3B; --rule-soft:#1A2331;
  --brass:#DFA943; --teal:#5CBACB; --rust:#D4795E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -16px rgba(0,0,0,.75);}}
:root[data-theme="dark"]{
  --ground:#0A0E15; --surface:#121926; --surface-2:#0F1520;
  --ink:#DCE3EE; --ink-soft:#B4C0D2; --muted:#8391A6; --rule:#212B3B; --rule-soft:#1A2331;
  --brass:#DFA943; --teal:#5CBACB; --rust:#D4795E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -16px rgba(0,0,0,.75);}
*{box-sizing:border-box}
html{overflow-x:hidden}
/* o atributo hidden tem que valer mais que qualquer display do CSS —
   sem isso a oferta ficava invisível mas ocupando 4.500px de rolagem */
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.frame{max-width:440px;margin:0 auto;min-height:560px;min-height:var(--vph,100svh);padding:0 20px 60px;position:relative}
@media(min-width:900px){.frame{max-width:480px}}
.prog{position:sticky;top:0;background:var(--ground);padding:18px 0 12px;z-index:10}
.prog-t{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prog-t b{color:var(--brass);font-weight:600}
.prog-b{display:flex;gap:4px}
.prog-b i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:background .3s}
.prog-b i.ok{background:var(--brass)} .prog-b i.now{background:var(--brass);opacity:.55}
.tela{padding-top:14px;animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.tela{animation:none}}
.tela.capa{display:flex;flex-direction:column;justify-content:center;min-height:460px;min-height:calc(var(--vph,100svh) * .82)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:0 0 14px}
h1.capa{font-family:var(--serif);font-size:clamp(30px,8.5vw,40px);font-weight:600;line-height:1.06;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance;font-variation-settings:'WONK' 1}
h2{font-family:var(--serif);font-size:clamp(25px,7vw,32px);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.lede{color:var(--ink-soft);margin:0 0 16px}
.lede b{color:var(--ink);font-weight:600}
.fine{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.fine.dim{opacity:.8;border-left:2px solid var(--rule);padding-left:11px}
label.f{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;position:relative}
label.f span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=email],input:not([type]){width:100%}
label.f input{font-family:var(--sans);font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:13px 12px;width:100%}
label.f input:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
label.chk{display:flex;gap:9px;align-items:center;margin-bottom:10px;font-size:14.5px;color:var(--ink-soft);cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--brass)}
.aclist{position:absolute;z-index:20;top:100%;left:0;right:0;max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:0 0 3px 3px}
.aclist div{padding:11px 12px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--rule-soft)}
.aclist div:hover{background:var(--surface-2);color:var(--brass)}
.aclist em{font-family:var(--mono);font-size:11px;color:var(--muted);font-style:normal;float:right}
button.go{width:100%;font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;background:var(--ink);color:var(--ground);border:0;border-radius:3px;padding:16px;cursor:pointer;margin-top:8px}
button.go:hover{background:var(--brass)}
button.ghost{width:100%;background:none;border:1px solid var(--rule);color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:12px;border-radius:3px;cursor:pointer;margin-top:9px}
.carta{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:38px 24px;text-align:center;margin:0 0 22px;box-shadow:var(--shadow)}
/* ---- cartas ilustradas ---- */
.carta.com-img{padding:0;overflow:hidden;position:relative;background:var(--surface-2,var(--surface))}
.carta-img{display:block;width:100%;height:auto;opacity:0;transition:opacity .55s ease;
  border-radius:4px 4px 0 0}
.carta-img.ok{opacity:1}
.carta.com-img .carta-txt{padding:20px 24px 26px}
.carta.com-img:has(.carta-img.ok){padding:0}
/* A arte já traz o número e o nome da carta. Quando ela carrega, o texto
   embaixo sai — repetir seria ruído. Se a imagem falhar, a carta
   tipográfica assume inteira, exatamente como sempre foi. */
.carta.com-img:has(.carta-img.ok) .carta-txt{display:none}
.carta.com-img:has(.carta-img.ok) .carta-img{border-radius:4px}
.carta.com-img:not(:has(.carta-img)) .carta-txt{padding:38px 24px}
.carta-tipo{display:block;width:100%;max-width:270px;height:auto;margin:0 auto 16px;
  border-radius:4px;opacity:0;transition:opacity .55s ease;box-shadow:var(--shadow)}
.carta-tipo.ok{opacity:1}
@media print{.carta-img,.carta-tipo{opacity:1!important;transition:none}}
@media(prefers-reduced-motion:reduce){.carta-img,.carta-tipo{transition:none}}
.carta-n{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--brass);margin-bottom:14px}
.carta-t{font-family:var(--serif);font-size:clamp(30px,9vw,42px);font-weight:600;margin:0 0 6px;letter-spacing:-.02em;line-height:1.05}
.carta-d{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.player{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:22px;margin-bottom:14px}
.pl-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:18px}
.pl-bar i{display:block;height:100%;background:var(--brass);transition:width .12s linear}
.pl-mid{display:grid;place-items:center;min-height:70px}
.pl-play{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--ground);border:0;border-radius:3px;padding:13px 26px;cursor:pointer}
.pl-done{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.pl-t{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.pede{border-top:1px solid var(--rule);padding-top:20px;margin-top:20px}
.pede h3{font-family:var(--serif);font-size:20px;font-weight:600;text-transform:none;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px}
.q{border-bottom:1px solid var(--rule-soft);padding:15px 0}
.q p{margin:0 0 11px;font-size:16px;line-height:1.4}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk button{height:42px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:13px;border-radius:3px;cursor:pointer}
.lk button.on{background:var(--brass);border-color:var(--brass);color:var(--ground);font-weight:600}
.bloco{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.bloco.tensao{border-left:3px solid var(--rust)}
.bloco.tensao h3{color:var(--rust)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 16px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:5px}
.kv dd{margin:0;font-weight:500}
.hero{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
dd.hero{font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule);border-radius:2px;color:var(--muted)}
.chip.on{border-color:var(--brass);color:var(--brass)}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.tri div{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:3px;padding:12px 6px;text-align:center}
.tri span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tri b{display:block;font-family:var(--serif);font-size:13.5px;font-weight:600;letter-spacing:-.02em;line-height:1.2;hyphens:none;overflow-wrap:normal;word-break:keep-all}
.tri i{font-family:var(--mono);font-size:11px;color:var(--muted);font-style:normal}
.dv{border-top:1px solid var(--rule-soft);padding-top:14px;margin-top:14px}
.dv:first-of-type{border-top:0;padding-top:0;margin-top:0}
.dv b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin-bottom:7px}
.dv p{margin:0 0 9px;font-size:15px;color:var(--ink-soft)}
.dv .perg{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--ink);margin:0}
.fecho{font-family:var(--serif);font-size:19px;font-style:italic;text-align:center;color:var(--ink);padding:6px 0 14px}
.oferta{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:20px;margin:20px 0}
.oferta span{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.oferta b{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.02em}
#rodape-v{max-width:440px;margin:0 auto;padding:0 20px calc(22px + env(safe-area-inset-bottom));
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);opacity:.55;line-height:1.5;text-align:left}
#rodape-v b{color:var(--brass);font-weight:500}
@media(max-width:400px){#rodape-v{font-size:9px}}
.selo-v{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-top:18px;padding-top:12px;border-top:1px solid var(--rule-soft)}
#reset{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);border:1px solid var(--rule);color:var(--muted);padding:7px 11px;border-radius:3px;cursor:pointer;z-index:50;opacity:.7}
#reset:hover{opacity:1;color:var(--brass)}

.lin{display:grid;grid-template-columns:98px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.lin:last-child{border-bottom:0}
.lin b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--brass);padding-top:2px}
.lin span{font-size:14.5px;color:var(--ink-soft);line-height:1.45}
.bloco.q1{border-left:3px solid var(--brass)}
.bloco.q2{border-left:3px solid var(--teal)}
.bloco.q3{border-left:3px solid var(--muted)}
.bloco.q4{border-left:3px solid var(--ink-soft)}
@media(max-width:400px){.lin{grid-template-columns:1fr;gap:2px}}

/* --- narrativa --- */
.hist{margin:22px 0 8px}
.mv{margin-bottom:26px}
.mv h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brass);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.mv p{font-family:var(--serif);font-size:17.5px;line-height:1.62;color:var(--ink);margin:0 0 13px;
  font-variation-settings:'opsz' 14}
.mv p:last-child{margin-bottom:0}
.mv p i{font-style:italic}
hr.sep{border:0;border-top:1px solid var(--rule);margin:34px 0 20px}
/* --- glossário --- */
details.gl{margin:12px 0 0;border-top:1px solid var(--rule-soft);padding-top:10px}
details.gl summary{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--teal);
  cursor:pointer;list-style:none;padding:2px 0}
details.gl summary::-webkit-details-marker{display:none}
details.gl summary::before{content:"› ";color:var(--teal)}
details.gl[open] summary::before{content:"⌄ "}
details.gl p{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:9px 0 0}
.tela.capa details.gl{border-top:0;padding-top:0;margin:6px 0 18px;background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:13px 15px}
/* --- consentimentos --- */
.cons{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:14px 15px;margin:6px 0 14px}
.cons .chk{align-items:flex-start;margin-bottom:12px;font-size:14px;line-height:1.45}
.cons .chk:last-child{margin-bottom:0}
.cons .chk input{margin-top:2px;flex:0 0 auto}
.cons .chk i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
/* --- ações --- */
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0 6px}
.acoes .ghost{margin-top:0}
@media(max-width:400px){.acoes{grid-template-columns:1fr}}
/* --- impressão / PDF --- */
@media print{
  :root{--ground:#fff;--surface:#fff;--surface-2:#fff;--ink:#101010;--ink-soft:#2c2c2c;
    --muted:#5a5a5a;--rule:#c8c8c8;--rule-soft:#e2e2e2;--brass:#7a5a10;--teal:#155e6b;--rust:#8a3d28;--shadow:none}
  body{background:#fff}
  .prog,.noprint,#reset{display:none!important}
  #rodape-v{display:none!important}
  .selo-v{display:block!important;color:#666}
  .frame{max-width:100%;padding:0}
  .tela{animation:none}
  .bloco,.carta{break-inside:avoid;box-shadow:none}
  .mv{break-inside:avoid}
  details.gl{display:block}
  details.gl p{display:block!important}
  h1.capa{font-size:30px}
}

/* --- territórios com área da casa --- */
.tri div.terr{text-align:left;padding:12px 11px}
.terr u{display:block;text-decoration:none;font-size:11.5px;line-height:1.4;color:var(--muted);margin-top:5px}
.terr i{display:block;font-family:var(--mono);font-size:10.5px;color:var(--teal);font-style:normal;margin-top:3px}
@media(min-width:420px){.tri{grid-template-columns:1fr}}
/* --- lista das 12 casas --- */
ul.casas{list-style:none;padding:0;margin:12px 0 0}
ul.casas li{position:relative;padding:8px 0 8px 34px;border-bottom:1px solid var(--rule-soft)}
ul.casas li:last-child{border-bottom:0}
ul.casas li em{position:absolute;left:0;top:8px;font-family:var(--mono);font-size:11px;font-style:normal;
  color:var(--brass);border:1px solid var(--rule);border-radius:2px;width:24px;height:20px;display:grid;place-items:center}
ul.casas li b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-bottom:1px}
ul.casas li span{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.45}
button.ghost.wide{grid-column:1/-1}

.breve{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:22px 20px;
  margin:20px 0;text-align:center;box-shadow:var(--shadow)}
.breve span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brass);margin-bottom:9px}
.breve b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.breve i{display:block;font-style:normal;font-size:13px;color:var(--muted);line-height:1.5}
.assina{border-top:1px solid var(--rule);margin-top:26px;padding-top:18px}
.assina b{display:block;font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:6px}
.assina span{display:block;font-size:14px;line-height:1.55;color:var(--ink-soft)}

table.ativ{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;
  font-variant-numeric:tabular-nums;margin-top:4px}
table.ativ th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 6px 0;border-bottom:1px solid var(--rule);font-weight:600}
table.ativ td{padding:5px 10px 5px 0;border-bottom:1px solid var(--rule-soft);color:var(--ink-soft)}
table.ativ td:first-child{color:var(--ink)}
table.ativ tr:last-child td{border-bottom:0}

.ps{border-left:2px solid var(--brass);padding:2px 0 2px 14px;margin:18px 0 26px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.ps b{color:var(--ink);letter-spacing:.02em}
/* ---- marca (capa) ---- */
.marca{margin:0 0 22px}
.marca .cat{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);margin-bottom:9px}
.marca .nome{display:block;font-family:var(--serif);font-size:clamp(23px,6.4vw,29px);font-weight:600;letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
.marca .sub{display:block;font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);margin-top:7px}

/* ---- data: dia / mês / ano ---- */
div.f{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
div.f>span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.dma{display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:8px}
.dma label{display:flex;flex-direction:column;gap:4px;min-width:0}
.dma i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dma input,.dma select{font-family:var(--sans);font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:13px 10px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.dma select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.dma input:focus,.dma select:focus{outline:2px solid var(--brass);outline-offset:1px}
.fine.erro{color:var(--rust);opacity:1}

/* ---- fecho da etapa 6 ---- */
.fim{border-top:1px solid var(--rule);margin-top:34px;padding-top:26px}
.fim-t{font-family:var(--serif);font-size:clamp(26px,7.4vw,34px);font-weight:600;letter-spacing:-.025em;line-height:1.06;margin:0 0 8px}
.fim-s{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink-soft);margin:0 0 20px;line-height:1.35}
.fim-q{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--brass);margin:22px 0 14px;line-height:1.3}
label.refl{margin-top:26px}
label.refl textarea{font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:12px;width:100%;resize:vertical}
label.refl textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
label.refl i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---- card da etapa 7 ---- */
.card7{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--brass);border-radius:4px;padding:22px 20px;margin:22px 0 18px;box-shadow:var(--shadow)}
.card7 .et{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.card7 b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.card7 em{display:block;font-style:italic;font-family:var(--serif);font-size:17px;color:var(--ink-soft);margin-bottom:10px}
.card7 i{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.refl-q{margin:0 0 14px;padding:12px 14px;border-left:2px solid var(--brass);background:var(--surface-2,transparent);font-family:var(--serif);font-size:17px;font-style:italic;color:var(--ink);line-height:1.45}
@media print{.refl-q{border-left:2px solid #999}}

/* ===================== CARTAZ (etapa 0) ===================== */
body[data-cena="cartaz"]{background:#07090E}
body[data-cena="cartaz"] #reset,body[data-cena="cartaz"] #rodape-v{display:none}
/* Na etapa 7 a pessoa já investiu 20 minutos. Um toque sem querer no
   "recomeçar" apagaria tudo — o botão não existe aqui. */
body[data-etapa="7"] #reset{display:none!important}
.cartaz{position:relative;min-height:540px;min-height:calc(var(--vph,100svh) - 20px);padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 6px 76px}
.cartaz::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 70% at 50% 42%,rgba(223,169,67,.055),transparent 62%)}
.c-tit{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.c-cat{font-family:var(--mono);font-size:11px;letter-spacing:.52em;text-indent:.52em;color:#DFA943;margin-bottom:20px}
.c-nome{font-family:var(--mono);font-weight:500;font-size:clamp(21px,6.6vw,29px);letter-spacing:.13em;
  text-indent:.13em;line-height:1.4;color:#DEE4EF;text-transform:uppercase}
.c-risco{width:38px;height:1px;background:#8A6A29;margin:22px 0}
.c-sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:#69768B;line-height:1.8}
.c-acao{position:relative;z-index:2;margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:18px}
.c-go{font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;
  font-weight:500;background:transparent;color:#DFA943;border:1px solid #8A6A29;border-radius:2px;
  padding:17px 40px;cursor:pointer;transition:background .25s,color .25s}
.c-go:hover,.c-go:focus-visible{background:#DFA943;color:#0A0A0A;outline:none}
.c-gl{max-width:340px;text-align:left;border:1px solid #1D2637;border-radius:3px;background:#0C1017}
.c-gl summary{list-style:none;cursor:pointer;padding:12px 15px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:#69768B}
.c-gl summary::-webkit-details-marker{display:none}
.c-gl summary::before{content:'\203A  ';color:#8A6A29}
.c-gl[open] summary{border-bottom:1px solid #1D2637;color:#DFA943}
.c-gl p{margin:0;padding:0 15px 13px;font-size:14px;line-height:1.6;color:#93A0B4;font-family:var(--sans)}
.c-gl p:first-of-type{padding-top:13px}
.c-gl b{color:#DEE4EF}
.c-rod{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;z-index:2;margin:0;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;line-height:1.9;color:#5C6A80}
.c-rod span{color:#8A6A29}

/* ============ MIOLO — âncora vertical fixa nas etapas 1,2,3,5 ============ */
.miolo{min-height:452px;min-height:calc(var(--vph,100svh) - 132px);display:flex;flex-direction:column;
  justify-content:center;justify-content:safe center;max-width:400px;margin:0 auto;
  width:100%;text-align:center;padding-bottom:44px}
.miolo.m-alto{justify-content:flex-start;padding-top:12px}
.miolo h2,.miolo h1{margin-bottom:30px}
.miolo .eyebrow{margin-bottom:12px}
.miolo .lede{text-wrap:balance}
.miolo>.fine:last-child{min-height:18px}
.campo{display:flex;flex-direction:column;gap:7px;margin-bottom:22px;text-align:center}
.campo>span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.campo input{font-family:var(--sans);font-size:18px;text-align:center;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:15px 12px;width:100%}
.campo input:focus{outline:2px solid var(--brass);outline-offset:1px}
.miolo .dma input,.miolo .dma select{text-align:center}
.miolo .f,.miolo label.f{text-align:left}

/* ===================== MODO DE INSTRUÇÃO ===================== */
body[data-instr] #reset,body[data-instr] #rodape-v{display:none}
body[data-instr]{overflow:hidden}
#instr{position:fixed;inset:0;z-index:400;background:#07090E;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .5s ease}
#instr.on{opacity:1;pointer-events:auto}
#instr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(223,169,67,.05),transparent 60%)}
.i-toque{position:absolute;inset:0;z-index:1;cursor:pointer}
.i-topo{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;z-index:3;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.i-som,.i-pular{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  background:transparent;color:#69768B;border:1px solid #1D2637;border-radius:2px;padding:6px 10px;cursor:pointer}
.i-som:hover,.i-pular:hover{color:#DFA943;border-color:#8A6A29}
.i-som[aria-pressed="true"]{color:#DFA943;border-color:#8A6A29}
.i-meio{flex:1;display:flex;align-items:center;align-items:safe center;padding:52px 24px 60px;
  position:relative;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch}
.i-linhas{display:flex;flex-direction:column;gap:20px;max-width:520px;margin:0 auto;width:100%}
.i-bl{opacity:0;transform:translateY(7px);transition:opacity .6s ease,transform .6s ease;margin:0}
.i-bl.on{opacity:1;transform:none}
.i-bl.velho{opacity:.26}
.i-bl.saindo{opacity:0;transform:translateY(-6px)}
.i-bl.sys{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#DFA943;line-height:1.7}
.i-bl.voz{font-family:var(--serif);font-size:19px;line-height:1.62;color:#DEE4EF;text-wrap:balance}
.i-cur{display:inline-block;width:8px;height:1.05em;background:#DFA943;vertical-align:-2px;margin-left:3px;
  animation:i-pisca 1.05s steps(2,start) infinite}
@keyframes i-pisca{50%{opacity:0}}
/* ---- escolha de tratamento, dentro do escuro ---- */
.i-bl.escolha{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.e-perg{font-family:var(--serif);font-size:20px;line-height:1.35;color:#DEE4EF;margin:0 0 4px;text-wrap:balance}
.e-ops{display:flex;gap:10px;width:100%;max-width:340px}
.e-ops button{flex:1;font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:500;background:transparent;color:#DFA943;border:1px solid #8A6A29;border-radius:2px;
  padding:16px 8px;cursor:pointer;transition:background .2s,color .2s,opacity .45s,border-color .2s}
.e-ops button:hover:not(:disabled){background:#DFA943;color:#0A0A0A}
.e-ops button:focus-visible{outline:2px solid #DFA943;outline-offset:2px}
.e-neutro{background:none;border:0;color:#5C6A80;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;cursor:pointer;padding:4px 8px;border-bottom:1px solid #262F41;transition:opacity .45s,color .2s}
.e-neutro:hover:not(:disabled){color:#DFA943}
.escolha .escolhido{background:#DFA943;color:#0A0A0A;border-color:#DFA943}
.escolha .apagado{opacity:.18}
.escolha.pisca .e-perg{animation:e-chama .7s ease}
@keyframes e-chama{0%,100%{color:#DEE4EF}45%{color:#DFA943}}

/* ---- a marca assume a forma escolhida ---- */
.i-bl.marca{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:6px 0}
.m-cat{font-family:var(--mono);font-size:10px;letter-spacing:.5em;text-indent:.5em;color:#8A6A29}
.m-nome{font-family:var(--mono);font-weight:500;font-size:clamp(17px,5.4vw,22px);letter-spacing:.13em;
  text-indent:.13em;line-height:1.5;color:#DFA943;text-transform:uppercase}

/* ===================== CENA ESCURA (etapas 6 e 7) ===================== */
body[data-cena="escuro"]{background:#07090E;color:#DEE4EF}
body[data-cena="escuro"] .prog-t{color:#69768B}
body[data-cena="escuro"] .prog-t b{color:#DFA943}
body[data-cena="escuro"] .prog-b i{background:#1D2637}
body[data-cena="escuro"] .prog-b i.ok,body[data-cena="escuro"] .prog-b i.now{background:#DFA943}
body[data-cena="escuro"] #reset{background:#121926;border-color:#1D2637;color:#69768B}
body[data-cena="escuro"] #rodape-v{color:#3D485C}
.escuro-tela{min-height:520px;min-height:calc(var(--vph,100svh) - 152px);display:flex;flex-direction:column;
  justify-content:center;justify-content:safe center;max-width:480px;margin:0 auto;padding-bottom:26px}
.h-escuro{font-family:var(--serif);font-size:clamp(27px,7.6vw,35px);font-weight:600;letter-spacing:-.025em;
  line-height:1.06;margin:14px 0 16px;color:#DEE4EF;text-wrap:balance}
.p-escuro{font-family:var(--serif);font-size:18px;line-height:1.6;color:#B4C0D2;margin:0 0 15px;text-wrap:balance}
.ps-escuro{border-left:2px solid #8A6A29;padding:2px 0 2px 14px;margin:0 0 26px;font-family:var(--serif);
  font-size:17px;line-height:1.6;color:#B4C0D2}
.ps-escuro b{color:#DFA943;font-family:var(--mono);font-size:12px;letter-spacing:.14em}
.fine-escuro{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#69768B;margin:0 0 22px}
.refl-q-escuro{margin:6px 0 16px;padding:12px 15px;border-left:2px solid #DFA943;background:#0E1420;
  font-family:var(--serif);font-size:17px;font-style:italic;color:#DEE4EF;line-height:1.45}

/* item recebido */
.item{background:#0E1420;border:1px solid #1D2637;border-left:3px solid #DFA943;border-radius:4px;
  padding:20px;margin:0 0 18px;display:flex;flex-direction:column;gap:7px}
.item .i-cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#8A6A29}
.item .i-nome{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.02em;color:#DEE4EF}
.item .i-sub{font-style:normal;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:#69768B;margin-bottom:6px}
.i-abrir{width:100%;font-family:var(--mono);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;
  font-weight:600;background:#DFA943;color:#0A0A0A;border:0;border-radius:3px;padding:15px;cursor:pointer}
.i-abrir:hover{background:#EDBB5C}
.go-escuro{width:100%;font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;background:#DEE4EF;color:#07090E;border:0;border-radius:3px;padding:16px;cursor:pointer;margin-top:6px}
.go-escuro:hover{background:#DFA943}
.volta-escuro{width:100%;background:none;border:1px solid #1D2637;color:#69768B;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding:12px;border-radius:3px;cursor:pointer;margin-top:12px}
.volta-escuro:hover{color:#DFA943;border-color:#8A6A29}
.refl-escuro{display:flex;flex-direction:column;gap:7px;margin:0 0 20px}
.refl-escuro>span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#69768B}
.refl-escuro textarea{font-family:var(--sans);font-size:16px;line-height:1.5;color:#131722;background:#F5F3EF;
  border:1px solid #2A3546;border-radius:3px;padding:12px;width:100%;resize:vertical}
.refl-escuro textarea:focus{outline:2px solid #DFA943;outline-offset:1px}
.refl-escuro i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:#4E5A70}
.card-escuro{background:#0E1420;border:1px solid #1D2637;border-radius:4px;padding:22px 20px;margin:8px 0 4px;
  display:flex;flex-direction:column;gap:9px}
.card-escuro .c-et{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#DFA943}
.card-escuro .c-nm{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;color:#DEE4EF}
.card-escuro .c-tp{font-style:normal;font-family:var(--mono);font-size:11px;color:#69768B;margin-bottom:6px}
.card-escuro .c-breve{font-family:var(--mono);font-size:11px;line-height:1.6;color:#5C6A80;transition:color .3s}
.card-escuro .c-breve.acende{color:#DFA943}
/* ===================== ETAPA 7 — VÍDEO E OFERTA ===================== */
/* O vídeo é vertical (9:16). O padding-top segura a proporção sem JS. */
.vvert{position:relative;padding-top:177.7778%;width:100%;margin:6px 0 12px;
  background:#0B1018;border:1px solid #1D2637;border-radius:5px;overflow:hidden}
.vvert iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
/* a tela da etapa 7 deixa de centralizar quando a oferta abre */
.escuro-tela.solto{justify-content:flex-start}
/* Antes da oferta abrir, a tela acaba onde o vídeo acaba — sem campo preto
   vazio embaixo convidando a rolar para lugar nenhum. */
.escuro-tela.t7{min-height:0;justify-content:flex-start;padding-bottom:10px}
.escuro-tela.t7.solto{padding-bottom:26px}

.im-oferta{display:block;opacity:0;transform:translateY(10px);
  transition:opacity .7s ease, transform .7s ease;
  border-top:1px solid #1D2637;margin-top:26px;padding-top:30px;
  min-width:0;max-width:100%}
.im-oferta.on{opacity:1;transform:none}
.im-et>div{min-width:0}
.im-eye{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:#DFA943;margin:0 0 12px}
.im-h{font-family:var(--serif);font-size:clamp(25px,7vw,32px);font-weight:600;letter-spacing:-.025em;
  line-height:1.08;color:#DEE4EF;margin:0 0 16px;text-wrap:balance}

.im-lista{list-style:none;margin:22px 0 0;padding:0}
.im-et{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #161E2C}
.im-et:last-child{border-bottom:0}
.im-n{font-family:var(--mono);font-size:11px;color:#8A6A29;flex:0 0 24px;padding-top:4px;letter-spacing:.04em}
.im-et b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.015em;
  color:#DEE4EF;margin-bottom:7px;line-height:1.2}
.im-a,.im-b{display:block;font-size:14.5px;line-height:1.55;padding-left:15px;position:relative}
.im-a{color:#7D8AA0;margin-bottom:5px}
.im-b{color:#B4C0D2}
.im-a::before,.im-b::before{position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px}
.im-a::before{content:'A';color:#4E5A70}
.im-b::before{content:'B';color:#DFA943}

.im-tri{display:grid;gap:10px;margin:18px 0 0}
.im-tri>div{background:#0E1420;border:1px solid #1D2637;border-radius:4px;padding:16px 18px}
.im-tri b{display:block;font-family:var(--serif);font-size:18px;color:#DEE4EF;margin-bottom:5px}
.im-tri span{font-size:14px;line-height:1.55;color:#8F9BB0}

.im-corte{height:1px;background:#1D2637;margin:34px 0 30px}

.im-planos{display:grid;gap:12px;margin:22px 0 10px}
@media(min-width:540px){.im-planos{grid-template-columns:1fr 1fr}}
.im-plano{background:#0E1420;border:1px solid #1D2637;border-radius:5px;padding:20px 18px;
  display:flex;flex-direction:column;gap:6px;position:relative}
.im-plano.im-destaca{border-color:#8A6A29}
.im-selo{position:absolute;top:-1px;right:14px;background:#DFA943;color:#141D24;font-family:var(--mono);
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:0 0 3px 3px}
.im-dur{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#69768B;margin-top:4px}
.im-val{font-family:var(--serif);font-size:33px;font-weight:600;letter-spacing:-.02em;color:#DEE4EF;line-height:1}
.im-val i{font-style:normal;font-size:15px;font-weight:400;color:#69768B}
.im-mes{font-family:var(--mono);font-size:11px;color:#69768B}
.im-mes.im-ouro{color:#DFA943}
.im-diz{font-size:14px;line-height:1.5;color:#8F9BB0;margin:4px 0 6px}
.im-go{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;background:none;color:#DEE4EF;border:1px solid #2A3546;border-radius:3px;
  padding:14px;cursor:pointer;margin-top:auto}
.im-go:hover{border-color:#DFA943;color:#DFA943}
.im-go.im-forte{background:#DFA943;color:#0A0A0A;border-color:#DFA943}
.im-go.im-forte:hover{background:#EDBB5C;color:#0A0A0A}

.im-caixa{margin:18px 0 0;border:1px solid #1D2637;border-radius:5px;overflow:hidden;background:#0F1520}
.im-caixa iframe{display:block;width:100%;height:720px;border:0}
.im-fora{text-align:center;margin:14px 0 0}
.im-fora a{font-family:var(--mono);font-size:11px;color:#69768B;text-decoration:underline;text-underline-offset:3px}

.i-bl.mov{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#DFA943;
  border-bottom:1px solid #1D2637;padding-bottom:8px;line-height:1.7}

/* ===================== A TELA DE CHECKOUT ===================== */
/* O pagamento tem tela própria. Não é uma caixinha espremida no meio da
   página: é um lugar para onde a pessoa vai, e de onde ela volta. */
#ckt{position:fixed;inset:0;z-index:600;background:#07090E;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .32s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ckt.on{opacity:1;pointer-events:auto}
body[data-ckt]{overflow:hidden}
.ckt-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid #1D2637;background:#0A0E15;flex:0 0 auto}
.ckt-quem{min-width:0}
.ckt-quem b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;color:#DEE4EF;line-height:1.2}
.ckt-quem span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#69768B;margin-top:3px}
.ckt-volta{flex:0 0 auto;background:none;border:1px solid #1D2637;color:#8391A6;font-family:var(--mono);
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;padding:9px 12px;border-radius:3px;cursor:pointer}
.ckt-volta:hover{color:#DFA943;border-color:#8A6A29}
.ckt-corpo{flex:1 1 auto;position:relative;background:#FFFFFF}
.ckt-corpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ckt-espera{position:absolute;inset:0;display:grid;place-items:center;background:#0A0E15;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:#69768B}
.ckt-fora{flex:0 0 auto;text-align:center;padding:12px;background:#0A0E15;border-top:1px solid #1D2637}
.ckt-fora a{font-family:var(--mono);font-size:11px;color:#8391A6;text-decoration:underline;text-underline-offset:3px}

/* ===================== A FICHA — documento dentro do jogo ===================== */
body[data-ficha]{overflow:hidden}
/* A Ficha é documento: ela recupera o mundo claro inteiro, sem herdar
   nenhuma cor da cena escura por trás. */
#ficha{position:fixed;inset:0;z-index:500;background:var(--ground);color:var(--ink);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .38s ease}
#ficha h1,#ficha h2,#ficha h4,#ficha b,#ficha dd,#ficha .hero,#ficha .fim-t,#ficha .fim-q{color:var(--ink)}
#ficha .fim-q{color:var(--brass)}
#ficha p,#ficha .lede,#ficha li,#ficha dt,#ficha summary{color:var(--ink-soft)}
#ficha .fine,#ficha .sub2,#ficha .selo-v,#ficha .assina span{color:var(--muted)}
#ficha h3,#ficha .eyebrow{color:var(--brass)}
#ficha .chip{border-color:var(--rule);color:var(--muted)}
#ficha .chip.on{background:var(--brass);color:var(--ground);border-color:var(--brass)}
#ficha .bloco{background:var(--surface);border-color:var(--rule)}
#ficha .fecho{color:var(--ink)}
#ficha.on{opacity:1;pointer-events:auto}
.f-topo{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--rule);background:var(--surface)}
.f-tit{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.f-fechar{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;background:none;
  border:1px solid var(--rule);color:var(--muted);padding:7px 11px;border-radius:3px;cursor:pointer}
.f-fechar:hover{color:var(--brass);border-color:var(--brass)}
.f-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 8px;max-width:440px;margin:0 auto;width:100%}
.f-pe{flex:0 0 auto;padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);
  background:var(--surface);max-width:440px;margin:0 auto;width:100%}
.f-acao{width:100%;background:none;border:1px solid var(--rule);color:var(--muted);font-family:var(--mono);
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:12px;border-radius:3px;cursor:pointer;margin-bottom:8px}
.f-acao:hover{color:var(--brass);border-color:var(--brass)}
.f-acao:disabled{opacity:.5;cursor:progress}
.f-destaque{border-color:var(--brass);color:var(--brass);font-weight:600}
.f-voltar{width:100%;font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;background:var(--ink);color:var(--ground);border:0;border-radius:3px;padding:15px;cursor:pointer;margin-top:4px}
.f-voltar:hover{background:var(--brass)}
.f-msg{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--muted);margin:6px 0 2px}
.ficha-sep{border:0;border-top:1px solid var(--rule);margin:34px 0}
@media print{
  #ficha{position:static;opacity:1;pointer-events:auto;display:block}
  .f-topo,.f-pe{display:none!important}
  .f-corpo{overflow:visible;max-width:100%;padding:0}
  body[data-ficha] #app,body[data-ficha] #instr{display:none!important}
}

/* revelação sem reajuste de linha */
.i-bl .ch{visibility:hidden}
.i-bl .ch.v{visibility:visible}
/* cursor de largura zero: nunca empurra uma palavra pra linha de baixo */
.i-cur{display:inline-block;width:0;height:1em;vertical-align:-2px;position:relative;background:none;
  animation:none}
.i-cur::after{content:'';position:absolute;left:1px;top:.02em;width:8px;height:1.02em;background:#DFA943;
  animation:i-pisca 1.05s steps(2,start) infinite}
/* a carta dentro da narração */
.i-bl.foto{display:flex;justify-content:center;margin:2px 0}
.i-bl.foto img{display:block;width:100%;max-width:250px;height:auto;border-radius:4px;
  box-shadow:0 18px 44px -18px rgba(0,0,0,.85)}
/* fim do ato */
.i-bl.segue{display:flex;justify-content:center;margin-top:8px}
.i-segue{font-family:var(--mono);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;
  font-weight:600;background:transparent;color:#DFA943;border:1px solid #8A6A29;border-radius:3px;
  padding:14px 34px;cursor:pointer;transition:background .2s,color .2s}
.i-segue:hover{background:#DFA943;color:#0A0A0A}
.i-segue:focus-visible{outline:2px solid #DFA943;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.i-cur::after{animation:none}}

.i-rod{position:absolute;bottom:0;left:0;right:0;text-align:center;z-index:3;margin:0;pointer-events:none;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#3D485C}
@media(prefers-reduced-motion:reduce){.i-bl,#instr{transition:none}.i-cur{animation:none}}
@media print{#instr{display:none!important}}

.sub2{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;font-weight:400}
</style>
