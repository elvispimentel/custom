# Copie para config.yaml (arquivo ignorado pelo git) ou use apenas variáveis de ambiente.
# NENHUM segredo vai aqui: COMPOSIO_API_KEY e COMPOSIO_USER_ID vêm de GitHub Secrets.

biblioteca:
  nome: "Biblioteca Pessoal"
  id: ""                      # preencha com o ID confirmado por 'localizar'

pastas_saida:                 # criadas FORA da biblioteca (no mesmo pai dela, salvo pai_id)
  pai_id: ""
  pdfs_nome: "Biblioteca Pessoal — PDFs para NotebookLM"
  pdfs_id: ""
  duplicados_nome: "Biblioteca Pessoal — Duplicados para Revisão"
  duplicados_id: ""
  controle_nome: "Biblioteca Pessoal — Controle do Agente"
  controle_id: ""

composio:
  base_url: "https://backend.composio.dev"
  versao_ferramentas: "latest"   # se a API recusar, fixe a versão exibida em 'verificar'
  contas:                        # opcional: connected_account_id de cada toolkit
    googledrive: ""
    i_love_pdf: ""
  auth_configs:                  # opcional: só se 'conectar' avisar que há mais de uma auth config
    googledrive: ""

arquivos:
  estabilidade_minutos: 30       # ignora arquivos alterados há menos que isso (ainda subindo)
  ignorar_nomes: [".DS_Store", "Thumbs.db", "desktop.ini"]   # lixo de sistema: fora do inventário
  pastas_de_copias: ["cópia", "copia", "copias", "cópias", "backup", "duplicad", "old"]

pdf:
  # local    = junta os PDFs no próprio runner (pypdf): sem limite por chamada, sem créditos (padrão)
  # ilovepdf = usa o iLovePDF via Composio (limite real: 20 arquivos por chamada; consome créditos)
  motor: "local"

ilovepdf:                        # só vale com pdf.motor: ilovepdf
  max_arquivos_por_chamada: 20   # limite real do esquema I_LOVE_PDF_MERGE_PDFS (maxItems=20)
  reservar_creditos: 0

lotes:
  agrupar_por: "tema"            # tema = junta todos os autores de um tema (lotes cheios); pasta = um grupo por pasta
  grupo_sem_tema: "Sem tema"     # onde entram os livros fora das pastas de tema
  max_documentos: 0              # 0 = sem limite de quantidade: junta o máximo que couber nas metas de MB e de palavras
                                 # (o limite de 25 era só do iLovePDF; com o motor local não existe)
  meta_mb: 180                   # meta (margem de segurança) abaixo do teto de 200 MB do NotebookLM
  meta_palavras: 450000
  limite_mb: 200                 # teto do NotebookLM por fonte (200 MB); nada acima disso é gerado
  limite_palavras: 500000        # teto do NotebookLM por fonte (500 mil palavras)
  paginas_amostra_texto: 20      # páginas amostradas para estimar palavras/texto
  palavras_por_pagina_padrao: 300
  minimo_caracteres_por_pagina: 25   # abaixo disso => provável digitalização (precisa OCR)

execucao:
  tempo_max_minutos: 300         # para com segurança antes do limite de 6 h do job
  pasta_trabalho: "trabalho"
  paralelismo_listagem: 6        # pastas listadas ao mesmo tempo no inventário (1 = uma por vez)

organizacao:                     # fase "temas e autores"
  destino: "dentro"              # dentro = <Biblioteca>/<Tema>/<Autor>/arquivo
  mover_nao_classificados: false  # false = quem não foi classificado fica onde está (só aparece no relatório)
  pasta_nao_classificados: "A classificar"
  pasta_sem_autor: "_Sem autor identificado"
  confianca_minima: 0.7
  classificador: "openai"        # regras | claude | openai  (exigem ANTHROPIC_API_KEY / OPENAI_API_KEY)
  modelo_openai: "gpt-4o-mini"
  modelo_claude: "claude-haiku-4-5-20251001"
  formatos_livro: ["pdf", "epub", "mobi", "azw3", "doc", "docx", "txt", "rtf", "odt"]  # o resto (imagens, html, psd, .icloud) não é movido
  temas:                         # edite livremente; palavras-chave em minúsculas
    "Hermetismo e Esoterismo": ["hermet", "kybalion", "alquimia", "esoter", "tarot", "ocult", "gnose", "astrolog", "magia", "teosof", "rosacruz", "maçon", "macon", "numerolog", "thoth", "trismegist"]
    "Cabala e Misticismo": ["cabala", "kabbal", "zohar", "sefirot", "místic", "mistic", "sufi", "upanishad", "budis", "yoga", "vedan", "espiritual"]
    "Psicologia e Arquétipos": ["arquétipo", "arquetipo", "jung", "psicolog", "inconsciente", "mito", "freud", "terapia", "emoç", "emoc", "comportament", "sonho", "psique"]
    "Física Quântica e Ciência": ["quânt", "quant", "física", "fisica", "cosmos", "neuro", "universo", "ciência", "ciencia", "biolog", "matemática", "matematica", "relatividade", "astronomia"]
    "Vendas e Negócios": ["vendas", "negoci", "marketing", "empreend", "lideran", "gestão", "gestao", "copywriting", "finança", "financ", "investi", "startup", "persuas", "negocia", "milion"]
    "Desenvolvimento Pessoal": ["hábito", "habito", "mindset", "produtiv", "autoconhec", "propósito", "proposito", "autoestima", "motiva", "disciplina", "sucesso", "inteligência emocional"]
    "Filosofia": ["filosof", "platão", "platao", "aristót", "aristot", "nietzsche", "sócrates", "socrates", "estoic", "sêneca", "seneca", "república", "republica", "ética", "etica", "metafísica", "metafisica", "kant", "schopenhauer"]
    "História e Sociedade": ["históri", "histori", "sociolog", "política", "politica", "guerra", "civiliza", "antropolog", "império", "imperio", "revolução", "revolucao", "economia"]
    "Religião e Teologia": ["bíblia", "biblia", "teolog", "cristian", "evangelho", "alcorão", "alcorao", "judaísmo", "judaismo", "igreja", "espírita", "espirita", "kardec"]
    "Saúde e Corpo": ["saúde", "saude", "nutri", "dieta", "medicin", "fitness", "jejum", "terapêut"]
